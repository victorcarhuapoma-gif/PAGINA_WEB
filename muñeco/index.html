<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLIP PATH CSS</title>
    <style>
        *{
    padding:0px;
    margin: 0px;
}
.contenedor{
    width: 400px;
    height: 400px;
    background-color: aquamarine;
    position: relative;
    margin: 0 auto;
    overflow: hidden;
}


.cabeza{
    width: 100px;
    height: 100px;
    background-color: blue;
    clip-path: polygon(50% 0%, 90% 20%, 100% 60%, 75% 100%, 25% 100%, 0% 60%, 10% 20%);
    position: absolute;
    left: 140px;
    top: 170px;

}

.cuerpo{
    width: 100px;
    height: 100px;
    background-color: rgb(255, 111, 0);
    clip-path: inset(5% 20% 15% 10%);
    position: absolute;
    left: 140px;
    top: 260px;

    }
.brazo_izquierdo{
    width: 100px;
    height: 50px;
    background-color: rgb(255, 0, 0);
   clip-path: polygon(0% 20%, 60% 20%, 60% 0%, 100% 50%, 60% 100%, 60% 80%, 0% 80%);
    position: absolute;
    left: 200px;
    top: 270px;


}
.brazo_derecha{
    width: 120px;
    height: 50px;
    background-color: rgb(0, 0, 0);
    clip-path: polygon(40% 0%, 40% 20%, 100% 20%, 100% 80%, 40% 80%, 40% 100%, 0% 50%);
    position: absolute;
    left: 70px;
    top: 270px;

}

.pierna_derecha{
    width: 100px;
    height: 100px;
    background-color: rgb(0, 0, 0);
   clip-path: ellipse(24% 12% at 50% 50%);
    position: absolute;
    left: 110px;
    top: 310px;

}
.pierna_izquierda{
    width: 100px;
    height: 100px;
    background-color: rgb(0, 0, 0);
    clip-path: ellipse(24% 12% at 50% 50%);
    position: absolute;
    left: 170px;
    top: 310px;

}
 
    .bottom{
    display: inline-block;
    padding: 15px 35px;
    border: 2px solid #000000;
    color: #ea3737;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-right: 20px;
    border-radius: 50px;
}
.bottom:hover {
    background-color: #f90202;
}
        </style>
    </head>
    <body>
       <div class="bottom"> <a href="../index.html">Atras </a></div>
    <div class="contenedor">
    <div class="cabeza"><img src="img/1.png" alt="" width="100"></div>
    <div class="brazo_izquierdo"><img src="img/4.png" alt="" ></div>
    <div class="brazo_derecha"><img src="img/3.png" alt="" ></div>
    <div class="pierna_derecha"></div>
    <div class="pierna_izquierda"></div>
     <div class="cuerpo"><img src="img/2.png" alt="" width="100"></div>
</div>
</body>
</html>
